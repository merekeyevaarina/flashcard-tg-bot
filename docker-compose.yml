
services:
  postgres:
    image: postgres:17
    container_name: flashcard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashcard_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: flashcard_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
